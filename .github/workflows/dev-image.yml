name: Dev image

# A personal branch's image, for the Pasithea community app store to pin.
#
# Upstream's release.yml publishes ghcr.io/getumbrel/murmur from version tags;
# this builds the same Dockerfile from this fork's `dev` branch and pushes it
# under this fork's own name, tagged per commit (dev-<sha>) and `dev`. The
# store's scripts/update-murmur.sh follows it and pins the multi-arch index
# digest, exactly as it would an upstream release.
#
# Actions are pinned to commit SHAs (the tag is in the comment), as upstream's
# workflows are.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/pasithea0/murmur

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Dockerfile builds the web app on the native platform and the runtime
      # stage only copies files, so no QEMU is needed for arm64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ github.sha }}
          # Nothing here is a release: no `latest`, and no second tag that a
          # store could accidentally pin to a moving name.
          flavor: latest=false

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The store pins the multi-arch index digest, never a per-arch one. The
      # tag is the full commit, so what the store pins names the exact commit
      # its image was built from.
      - name: Check both architectures
        run: |
          docker buildx imagetools inspect "${IMAGE}:dev-${GITHUB_SHA}" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt && grep -q 'linux/arm64' manifest.txt
          echo "image: ${IMAGE}:dev-${GITHUB_SHA}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
